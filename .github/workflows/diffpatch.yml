name: Standalone tweak tests
on:
  push:
    paths: ['tweaks/**', 'tests/tweaks/**', 'docs/tweaks/**', 'schemas/**', '.github/workflows/diffpatch.yml']
  pull_request:
    paths: ['tweaks/**', 'tests/tweaks/**', 'docs/tweaks/**', 'schemas/**', '.github/workflows/diffpatch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for f in tweaks/*/run.sh tweaks/ssh/assets/service.sh; do
            sh -n "$f" || exit 1
          done
      - name: Exercise standalone installers
        run: python3 tests/tweaks/test_installers.py
      - name: Verify manifests and worker configuration
        run: python3 tests/tweaks/test_metadata.py
      - name: Exercise SSH supervisor
        run: python3 tests/tweaks/test_ssh_service.py

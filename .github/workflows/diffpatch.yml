name: Standalone tweak tests
on:
  push:
    paths: ['lib/**', 'tweaks/**', 'build/tweaks/**', 'tests/tweaks/**', 'docs/tweaks/**', 'schemas/**', '.github/workflows/diffpatch.yml']
  pull_request:
    paths: ['lib/**', 'tweaks/**', 'build/tweaks/**', 'tests/tweaks/**', 'docs/tweaks/**', 'schemas/**', '.github/workflows/diffpatch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for f in lib/*.sh tweaks/*/run.sh tweaks/ssh/assets/service.sh; do
            sh -n "$f" || exit 1
          done
      - name: Exercise standalone installers
        run: python3 tests/tweaks/test_installers.py
      - name: Exercise optional command and multi-target libraries
        run: python3 tests/tweaks/test_libraries.py
      - name: Verify manifests and reproducible installers
        run: python3 tests/tweaks/test_metadata.py
      - name: Exercise SSH supervisor
        run: python3 tests/tweaks/test_ssh_service.py
      - name: Package and verify all assets
        run: python3 build/tweaks/package.py "$RUNNER_TEMP/tweaks.zip"

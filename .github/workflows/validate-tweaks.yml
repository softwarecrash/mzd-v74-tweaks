name: Validate tweaks
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests, shell syntax and registered coverage
        run: python tools/validate.py
      - name: Check manifest readers and data-only parsing
        run: python tests/contract/test_manifest.py
      - name: Test shared shim loading, rollback and saved removal
        run: python tests/contract/test_shims.py
      - name: Test settings validation, saved values and background jobs
        run: python tests/contract/test_settings.py
      - name: Test read-only Touch prerequisites
        run: sh tests/tweaks/touch-while-driving/reader.sh usb/tweaks/touch-while-driving/touch.sh
      - name: Test mutable config defaults and ownership
        run: python tests/contract/test_config_data.py
      - name: Test package inventory batching and failure handling
        run: python tests/contract/test_package_inventory.py
      - name: Test persistent packages, versions and owned paths
        run: python tests/contract/test_packages.py
      - name: Test Restore with real saved workers and owned locks
        run: python tests/contract/test_restore_locks.py
      - name: Test automatic GUI support and saved consumer lifecycle
        run: |
          python tests/contract/test_gui_extensions.py
          python tests/contract/test_gui_extensions.py --hello-world-only
          python tests/contract/test_gui_extensions.py --status-only
          python tests/contract/test_gui_extensions.py --interrupt-only
          python tests/contract/test_gui_extensions.py --critical-only
          python tests/contract/test_gui_extensions.py --ssh-coexist-only
          python tests/contract/test_gui_extensions.py --services-only
          python tests/contract/test_gui_extensions.py --wallpaper-only
          python tests/contract/test_gui_extensions.py --restore-only
          python tests/contract/test_gui_extensions.py --i18n-compat-only
          python tests/contract/test_gui_extensions.py --tetris-config-only
          python tests/contract/test_gui_extensions.py --config-example-only
      - name: Check shell errors
        run: shellcheck --severity=error --shell=sh usb/autorun.sh usb/installer.sh usb/lib/*.sh usb/lib/gui-runtime/service/supervisor.sh usb/tweaks/*/run.sh usb/tweaks/*/reset.sh usb/tweaks/terminal/assets/terminal.sh development/examples/hello/run.sh development/examples/settings/run.sh development/examples/shim/run.sh development/examples/shim/reset.sh development/examples/shim/build.sh development/examples/bundle/run.sh development/examples/bundle/reset.sh development/examples/bundle/build.sh development/examples/gui-extension/run.sh development/examples/gui-extension/reset.sh development/examples/gui-hello-world/run.sh development/examples/gui-hello-world/reset.sh
      - name: Install full static BusyBox test applets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox-static lua5.1
          busybox patch --help
          busybox diff --help
      - name: Test wallpaper storage domain with generated PNG input
        run: python tests/tweaks/wallpaper-manager/test_backend.py
      - name: Verify all shared-target patch combinations
        run: python tests/contract/test_combinations.py
      - name: Exercise the real SSH supervisor with fake system commands
        run: |
          python tests/contract/test_ssh_service.py
          python tests/contract/test_ssh_readiness.py
      - name: Test variable component bundles and settings configuration
        run: |
          python tests/contract/test_components.py
          python tests/contract/test_bundles.py
          python tests/contract/test_android_auto.py
      - name: Test USB export commands and background jobs
        run: python tests/contract/test_exports.py
      - name: Test internal backup restore and owned cleanup hooks
        run: python tests/contract/test_restore.py
      - name: Test confirmed recovery of unmanaged patch targets
        run: |
          python tests/contract/test_recovery_mounts.py
          python tests/contract/test_recovery.py
      - name: Test optional restart and launcher cleanup
        run: python tests/contract/test_restart.py
      - name: Test installer replug session
        run: python tests/contract/test_session.py
      - name: Test read-only system metrics
        run: python tests/contract/test_metrics.py
      - name: Test diagnostics configuration and USB snapshots
        run: python tests/contract/test_logging.py
      - name: Test car date and time for names, log lines and file dates
        run: python tests/contract/test_datetime.py
      - name: Test final result messages and current patch example
        run: python tests/contract/test_report_messages.py
      - name: Validate factory Lua syntax
        run: |
          sudo apt-get install -y lua5.1
          for file in usb/lib/lua-bridge/*.lua usb/tweaks/*/assets/*.lua usb/tweaks/*/assets/*/*.lua tests/transport/*.lua; do luac5.1 -p "$file"; done
      - name: Test Hello entrypoint
        run: python tests/contract/test_hello.py
      - name: Test Terminal entrypoint
        run: python tests/contract/test_terminal.py
  busybox:
    # Prepares the CMU-like BusyBox 1.19.2 (ARM, static; tools/busybox/README.md) for the tweak tests:
    # tools/busybox/prepare.sh builds it and runs all checks of the BusyBox itself, but only when the files of
    # the build or of its checks changed (it keeps a fingerprint of them next to the program). The cache holds
    # only a BusyBox that passed those checks (actions/cache saves only when the job succeeds), so the jobs that
    # use it do not check it again. tools/test-in-container.sh runs the same script locally. It runs on an ARM
    # runner, whose processor runs the 32-bit ARM build tools and BusyBox directly, without emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The fingerprint of the files of the build and of its checks (not the README), as prepare.sh computes it:
      # a change in any of them builds and checks again. prepare.sh holds the only list of these files.
      - name: Fingerprint the build and check files
        id: fingerprint
        run: |
          fp=$(sh tools/busybox/prepare.sh --fingerprint)
          [ -n "$fp" ]
          echo "value=$fp" >>"$GITHUB_OUTPUT"
      - name: Take the checked BusyBox of the same build and checks from the cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/cmu-busybox/busybox
            .cache/cmu-busybox/checked
          key: cmu-busybox-${{ steps.fingerprint.outputs.value }}
      - name: Build and check the CMU-like BusyBox (only if not already checked)
        run: sh tools/busybox/prepare.sh
      - name: Keep the logs of a failed build or check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmu-busybox-logs
          path: |
            .cache/cmu-busybox/apt.log
            .cache/cmu-busybox/make.log
            .cache/cmu-busybox/busybox.config
            .cache/cmu-busybox/testsuite.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cmu-busybox
          path: .cache/cmu-busybox/busybox
          retention-days: 7
  workers:
    # The real worker entrypoints in a read-only, networkless container that holds only the CMU-like
    # BusyBox (its sh and its applets, linked as on the CMU) and a Python for the test driver
    # (tools/busybox/image/), run as a tweak runs on the CMU (tools/busybox/image/run.sh). It uses the BusyBox
    # prepared and checked by the job busybox and does not check it again. It runs on an ARM runner, whose
    # processor runs the 32-bit ARM BusyBox directly, without emulation.
    needs: busybox
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cmu-busybox
          path: .cache/cmu-busybox
      - name: Make the test image (only the CMU-like BusyBox, laid out as on the CMU, and Python for the driver)
        run: |
          chmod 755 .cache/cmu-busybox/busybox
          sh tools/busybox/image/make-image.sh .cache/cmu-busybox/busybox cmu-tweak-test:local
      - name: Test package inventory on the CMU-like BusyBox
        run: sh tools/busybox/image/run.sh /usr/local/bin/python3 tests/contract/test_package_inventory.py
      - name: Test package controller on the CMU-like BusyBox
        run: sh tools/busybox/image/run.sh /usr/local/bin/python3 tests/contract/test_packages.py
      - name: Run actual workers in the test image, as a tweak runs on the CMU
        run: sh tools/busybox/image/run.sh /usr/local/bin/python3 tests/contract/test_workers.py
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Every test file of tests/installer/ (node:test); a new file there runs without editing this list.
      # The pattern is quoted so that Node, not the shell, expands it.
      - name: Installer UI tests (every tests/installer/*.cjs)
        run: node --test "tests/installer/*.cjs"
      - run: node tests/tweaks/tetris/shared-sdk.cjs
      - run: node tests/tweaks/traffic-jam/behavior.cjs
      - run: node tests/tweaks/tetris/highscore.cjs
      - run: node tests/tweaks/wallpaper-manager/preview.cjs
      - run: node tests/tweaks/wallpaper-manager/preview-service.cjs
      - run: node tests/tweaks/wallpaper-manager/cmu-client.cjs
      - run: node tests/tweaks/wallpaper-manager/cmu-host.cjs
      - run: node tests/tweaks/wallpaper-manager/localized-view.cjs
      - run: node tests/tweaks/android-auto/test-view.cjs
      - run: node tests/tweaks/remove-safety-warnings/behavior.cjs

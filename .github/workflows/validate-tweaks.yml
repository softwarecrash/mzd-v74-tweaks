name: Validate tweaks
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests, shell syntax and registered coverage
        run: python tools/validate.py
      - name: Check manifest readers and data-only parsing
        run: python tests/contract/test_manifest.py
      - name: Test shared shim loading, rollback and saved removal
        run: python tests/contract/test_shims.py
      - name: Test settings validation, saved values and background jobs
        run: python tests/contract/test_settings.py
      - name: Test persistent packages, versions and owned paths
        run: python tests/contract/test_packages.py
      - name: Test automatic GUI support and saved consumer lifecycle
        run: |
          python tests/contract/test_gui_extensions.py
          python tests/contract/test_gui_extensions.py --hello-world-only
          python tests/contract/test_gui_extensions.py --status-only
          python tests/contract/test_gui_extensions.py --interrupt-only
          python tests/contract/test_gui_extensions.py --critical-only
          python tests/contract/test_gui_extensions.py --services-only
          python tests/contract/test_gui_extensions.py --wallpaper-only
          python tests/contract/test_gui_extensions.py --restore-only
          python tests/contract/test_gui_extensions.py --i18n-compat-only
      - name: Check shell errors
        run: shellcheck --severity=error --shell=sh usb/autorun.sh usb/installer.sh usb/lib/*.sh usb/lib/gui-runtime/service/supervisor.sh usb/tweaks/*/run.sh usb/tweaks/*/reset.sh usb/tweaks/terminal/assets/terminal.sh development/examples/hello/run.sh development/examples/settings/run.sh development/examples/shim/run.sh development/examples/shim/reset.sh development/examples/shim/build.sh development/examples/bundle/run.sh development/examples/bundle/reset.sh development/examples/bundle/build.sh development/examples/gui-extension/run.sh development/examples/gui-extension/reset.sh development/examples/gui-hello-world/run.sh development/examples/gui-hello-world/reset.sh
      - name: Install full static BusyBox test applets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox-static lua5.1
          busybox patch --help
          busybox diff --help
      - name: Test wallpaper storage domain with generated PNG input
        run: python tests/tweaks/wallpaper-manager/test_backend.py
      - name: Run actual workers in a read-only, networkless BusyBox container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,size=128m \
            -e PYTHONDONTWRITEBYTECODE=1 -e CMU_TEST_BUSYBOX=1 \
            -v "$(command -v busybox):/usr/local/bin/busybox:ro" \
            -v "$PWD:/repo:ro" -w /repo python:3.12-alpine \
            python tests/contract/test_workers.py
      - name: Verify all shared-target patch combinations
        run: python tests/contract/test_combinations.py
      - name: Exercise the real SSH supervisor with fake system commands
        run: python tests/contract/test_ssh_service.py
      - name: Test variable component bundles and settings configuration
        run: |
          python tests/contract/test_components.py
          python tests/contract/test_bundles.py
          python tests/contract/test_tplink_loader.py
          python tests/contract/test_tplink_rtl8811au.py --critical-mode-rollback
      - name: Test USB export commands and background jobs
        run: python tests/contract/test_exports.py
      - name: Test internal backup restore and owned cleanup hooks
        run: python tests/contract/test_restore.py
      - name: Test confirmed recovery of unmanaged patch targets
        run: |
          python tests/contract/test_recovery_mounts.py
          python tests/contract/test_recovery.py
      - name: Test optional restart and launcher cleanup
        run: python tests/contract/test_restart.py
      - name: Test installer replug session
        run: python tests/contract/test_session.py
      - name: Test read-only system metrics
        run: python tests/contract/test_metrics.py
      - name: Test diagnostics configuration and USB snapshots
        run: python tests/contract/test_logging.py
      - name: Test car date and time for names, log lines and file dates
        run: python tests/contract/test_datetime.py
      - name: Test final result messages and current patch example
        run: python tests/contract/test_report_messages.py
      - name: Validate factory Lua syntax
        run: |
          sudo apt-get install -y lua5.1
          for file in usb/lib/lua-bridge/*.lua usb/tweaks/*/assets/*.lua tests/transport/*.lua; do luac5.1 -p "$file"; done
      - name: Test Hello entrypoint
        run: python tests/contract/test_hello.py
      - name: Test Terminal entrypoint
        run: python tests/contract/test_terminal.py
  tplink-rtl8811au-release:
    # The driver files are committed so the branch download stays ready to run.
    # This proves they are exactly the pinned cmu150-rtl8811au release.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Committed driver files equal the pinned release
        run: python tools/update_tplink_rtl8811au.py --check
  launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/installer/test-es5.cjs
      - run: node tests/installer/test-startup-errors.cjs
      - run: node tests/installer/test-ui.cjs
      - run: node tests/installer/test-gui-runtime.cjs
      - run: node tests/installer/test-gui-i18n.cjs
      - run: node tests/installer/test-gui-residents.cjs
      - run: node tests/installer/test-gui-services.cjs
      - run: node tests/tweaks/tetris/shared-sdk.cjs
      - run: node tests/tweaks/wallpaper-manager/preview.cjs
      - run: node tests/tweaks/wallpaper-manager/cmu-client.cjs
      - run: node tests/tweaks/wallpaper-manager/cmu-host.cjs
      - run: node tests/tweaks/wallpaper-manager/localized-view.cjs
      - run: node tests/installer/test-transport.cjs
      - run: node tests/tweaks/no-more-disclaimer/behavior.cjs

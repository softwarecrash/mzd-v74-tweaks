contract_version=1
id=config-example
name=Config Data Example
description=Neutral lazy-loaded GUI view using automatically managed shared support. Development example only.
version=0.1.0
type=gui-extension
group=interface
firmware=74.00.324
entrypoint=run.sh
actions=install uninstall status
status_scope=payload
reboot_required=true
requires=
conflicts=
reset_entrypoint=reset.sh
gui_api=1
gui_menu_path=
gui_label=Config Data Example
gui_entrypoint=assets/view.html

# A file: no trailing slash. Existing contents are never overwritten.
config.preferences.path=/tmp/mnt/data_persist/mzd-tweaks/data/config-example/preferences.conf
config.preferences.source=assets/defaults/preferences.conf
# A directory: trailing slash. Runtime-created files are covered too.
config.state.path=/tmp/mnt/data_persist/mzd-tweaks/data/config-example/state/
config.state.source=assets/defaults/state/
# No source: the application creates the file when it first needs it.
config.session.path=/tmp/mnt/data_persist/mzd-tweaks/data/config-example/session.conf

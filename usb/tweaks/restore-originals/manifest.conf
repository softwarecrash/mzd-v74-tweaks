id=restore-originals
name=Restore originals
contributors=piotrmocko (original); SoftWareCrash (launcher integration)
description=Restore internal .org file backups and reset registered tweaks. All patches on restored files are reset. Current files and backups are saved on USB first.
version=0.8.2
type=command
group=system
firmware=74.00.324
entrypoint=run.sh
actions=run status
target=/jci
status_scope=configuration
reboot_required=true
requires=
conflicts=
progress=true
refresh_all=true
confirmation=Restore all internal .org backups and remove managed tweak extras? This resets every patch on affected files, including tweaks from other installers. Known OEM hashes are checked; other .org files are restored as saved and cannot be authenticated as factory originals. Tweak services may stop and additional tweak files may be removed. Current files and .org backups are archived on this USB first. Backups are deleted from the CMU only after successful restoration and cleanup. This is not a complete factory reset. Keep power on and leave the USB connected.

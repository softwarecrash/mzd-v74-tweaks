contract_version=1
id=cluster-language
name=Instrument Cluster and HUD Language
contributors=patrikguth
description=Choose the language of the instrument cluster and HUD while the CMU language stays unchanged. This also changes cluster/HUD warning texts. English may enable HUD street names. Restart required.
version=1.0.0
type=files
group=system
firmware=74.00.324
entrypoint=run.sh
actions=install uninstall status
target=/jci/sm/sm.conf
oem_backup_md5=74d9fc389b74fb01d0cfc2615a82c782
lock_group=sm-config
status_scope=payload
reboot_required=true
requires=
conflicts=
reset_entrypoint=reset.sh
components=components.tsv
settings=hud_display_language hud_display_code
setting.hud_display_language.type=choice
setting.hud_display_language.label=Cluster / HUD language
setting.hud_display_language.default=off
setting.hud_display_language.options=off en-uk en-us en-au ar zh-cn zh-tw cs da nl fi fr fr-ca de hu it ja no pl pt ru sk es es-mx sv tr uk
setting.hud_display_language.labels=Off|English (UK)|English (US)|English (Australia)|Arabic|Chinese (Simplified)|Chinese (Traditional)|Czech|Danish|Dutch|Finnish|French|French (Canada)|German|Hungarian|Italian|Japanese|Norwegian|Polish|Portuguese|Russian|Slovak|Spanish|Spanish (Mexico)|Swedish|Turkish|Ukrainian
setting.hud_display_language.help=off passes through the normal CMU language code. Any language changes cluster/HUD texts, not the CMU interface.
setting.hud_display_code.type=number
setting.hud_display_code.label=Custom language code
setting.hud_display_code.default=0
setting.hud_display_code.min=0
setting.hud_display_code.max=255
setting.hud_display_code.step=1
setting.hud_display_code.help=For testing other codes. 0 uses the language above; any other value replaces it.

contract_version=1
id=carplay-display
name=CarPlay Display
contributors=piotrmocko
description=Scale CarPlay to fit your screen size. This patch modifies the CarPlay configuration file to set the correct display size, preventing stretching of maps and icons.
version=0.1.0
type=files
group=system
firmware=74.00.324
entrypoint=run.sh
actions=install uninstall status
target=/jci/carplay/carplay_config_create.xml
oem_backup_md5=b420a8a510aa8e3de24c04430dd07638
lock_group=sm-config
status_scope=payload
reboot_required=true
requires=
conflicts=
reset_entrypoint=reset.sh
components=components.tsv

settings=display_size
setting.display_size.type=choice
setting.display_size.label=Display size
setting.display_size.default=154x85
setting.display_size.options=154x85 177x100 244x92 297x113
setting.display_size.labels=7-inch|8-inch|10.25-inch|12.3-inch
setting.display_size.help=Select the physical screen size of your car so CarPlay scales properly without stretching maps or icons.

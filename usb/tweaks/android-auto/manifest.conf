contract_version=1
id=android-auto
name=Android Auto Mod
contributors=piotrmocko, VitaliyKurokhtin and contributors
description=Unlocks touchscreen in Android Auto and displays navigation on HUD. Installs OEM AA Mod version 0.10.0.
version=0.1.3
type=files
group=system
firmware=74.00.324
entrypoint=run.sh
actions=install uninstall status
target=/jci/sm/sm.conf
oem_backup_md5=74d9fc389b74fb01d0cfc2615a82c782
lock_group=sm-config
status_scope=payload
reboot_required=true
requires=
conflicts=
reset_entrypoint=reset.sh
components=components.tsv

settings=resolution_dpi resolution_par
setting.resolution_dpi.type=number
setting.resolution_dpi.label=Resolution DPI
setting.resolution_dpi.unit=
setting.resolution_dpi.default=141
setting.resolution_dpi.min=100
setting.resolution_dpi.max=160
setting.resolution_dpi.step=1
setting.resolution_dpi.help=Recommended values impacting AA layout change: 103, 113, 122, 141, 153 (10.25-inch aftermarket display), 160.
setting.resolution_par.type=choice
setting.resolution_par.label=Pixel Aspect Ratio
setting.resolution_par.default=10670
setting.resolution_par.options=10670 15800
setting.resolution_par.help=Factory display: 10670. Aftermarket 10.25-inch display: 15800.

payload_dir=/tmp/mnt/data_persist/oem-aa-mod
config.libpatch.path=/tmp/mnt/data_persist/oem-aa-mod/libpatch.conf
config.libpatch.source=assets/libpatch.conf

gui_api=1
gui_menu_path=
gui_label=Android Auto Settings
gui_entrypoint=assets/view.html
gui_resident=assets/resident.js
gui_service=assets/service/entry.lua
gui_translations=assets/i18n.js

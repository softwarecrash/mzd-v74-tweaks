contract_version=1
id=logs-collector
name=Log Collector
contributors=piotrmocko; SoftWareCrash
description=Run copies running logs to USB, or applies log rotation size if the setting was changed.
version=0.9.1
type=command
group=tools
firmware=74.00.324
entrypoint=run.sh
actions=run status
target=/data/log/syslog-ng.conf
oem_backup_md5=62b15df0e73fd732774e9c5968041899
status_scope=configuration
reboot_required=false
requires=
conflicts=
progress=true
settings=log_rotation_size
setting.log_rotation_size.type=choice
setting.log_rotation_size.label=Logs rotation size
setting.log_rotation_size.default=512
setting.log_rotation_size.options=512 1024 5120
setting.log_rotation_size.labels=Stock 512 KB|Medium 1 MB|Enlarged 5 MB
setting.log_rotation_size.help=Stores more logs before they are overwritten, giving more driving time before copying.

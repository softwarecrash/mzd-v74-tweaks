@version: 3.3

#############################################################################
# global options

options {
    # Maximum length of a message in bytes.
    # Already limited in common_log.c .
    log_msg_size(1024);

    # Number of messages that a destination output queue can store.
    log_fifo_size(20000);
    # Time to waits for lines to accumulate in the output buffer.
    flush_timeout(500);

    # Syslog-ng timestamp format (1970-01-01T05:18:42.883+00:00).
    ts_format(iso);
    # Use millisecond timestamp granularity.
    frac_digits(3);
    # Use timestamps received from the sending application (or client).
    keep_timestamp(yes);

    # Disable DNS usage.
    use_dns(no);
    # Disable periodic MARK messages in the log.
    mark_freq(0);
    # Disable periodic syslog-ng statistics.
    stats_freq(0);

    # Time to wait in seconds before an idle destination file is closed.
    time_reap(300);
    # Time to wait in seconds before a dead TCP connection is reestablished.
    time_reopen(10);
};


#############################################################################
# pattern databases

parser p_jci {
    # Define a JCI patter database for messages coming from common_log.c .
    # FIXME: Not effiient.
    db_parser(file("/etc/syslog-ng/rules/rules.xml"));
};


#############################################################################
# templates

template t_simplified {
    template("${jci_log_tstamp} ${jci_zone}[${jci_pid}] ${jci_level}: ${jci_msg}\n");
};

template t_default {
    template("${jci_log_tstamp} ${jci_zone}[${jci_pid}] ${jci_level} (${jci_file}:${jci_line} ${jci_func}) ${jci_msg}\n");
};

template t_forensic {
    template("${jci_log_tstamp} ${jci_process}[${jci_pid}/${jci_tid}] ${jci_zone}/${jci_level} (${jci_file}:${jci_line} ${jci_func}) ${jci_msg}\n");
};


#############################################################################
# filters

filter f_jci {
    tags("jci");
};

filter f_nonjci
{
    not tags("jci");
};

filter f_errors {
    # Define a filter for all messages with level error and above.
    level(err..emerg);
};

filter f_user {
    (
        "" != ""
    )
};

filter f_useless {
    not tags("useless_errors");
};

#############################################################################
# rewrite rules

rewrite r_jci_log_tstamp {
    # syslog-ng does not provide a way to get timestamp with fractional seconds.
    #   Produce one by curring off the date (first 7 characters) from a BSD timestamp.
    set("${R_DATE}",    value("jci_log_tstamp"));
    subst(".{7}", "",   value("jci_log_tstamp"));
};

rewrite r_nonjci {
    set("${PROGRAM}",   value("jci_zone")       condition(filter(f_nonjci)));
    set("${PID}",       value("jci_pid")        condition(filter(f_nonjci)));
    set("${PROGRAM}",   value("jci_process")    condition(filter(f_nonjci)));
    set("",             value("jci_tid")        condition(filter(f_nonjci)));
    set("",             value("jci_file")       condition(filter(f_nonjci)));
    set("",             value("jci_func")       condition(filter(f_nonjci)));
    set("",             value("jci_line")       condition(filter(f_nonjci)));
    set("${MSGONLY}",   value("jci_msg")        condition(filter(f_nonjci)));

    # Define level strings that match the common_log.c ones.
    # FIXME: Not efficient.
    set("Fatal",        value("jci_level")      condition(filter(f_nonjci) and level(emerg)));
    set("Alert",        value("jci_level")      condition(filter(f_nonjci) and level(alert)));  # Not a JCI error level
    set("Critical",     value("jci_level")      condition(filter(f_nonjci) and level(crit)));
    set("Error",        value("jci_level")      condition(filter(f_nonjci) and level(err)));
    set("Warn",         value("jci_level")      condition(filter(f_nonjci) and level(warning)));
    set("Note",         value("jci_level")      condition(filter(f_nonjci) and level(notice)));
    set("Info",         value("jci_level")      condition(filter(f_nonjci) and level(info)));
    set("Debug",        value("jci_level")      condition(filter(f_nonjci) and level(debug)));

    # Change empty zone strings to "null".
    set("null",         value("jci_zone")       condition("$jci_zone" eq ""));
};


#############################################################################
# sources

source s_syslogng {
    # Handle internal syslog-ng messages.
    internal();
};

source s_system {
    # Handle the system log. Use a UNIX datagram socket to avoid connections.
    # Reformat multiline messages to a single line.
    unix-dgram("/dev/log" log_fetch_limit(100) log_iw_size(10000));

    # Handle kernel messages.
    file("/proc/kmsg" program-override("kernel") flags(kernel));

    #Handle stdout/stderr redirection (see also main.c - FIFO-pipe filenames must match)
    pipe("/tmp/redirlogs/stdout" program-override("Std") flags(no-parse) default-priority("info"));
    pipe("/tmp/redirlogs/stderr" program-override("Std") flags(no-parse) default-priority("err"));
};


#############################################################################
# destinations

destination d_buffer {
    # Local log circular buffer in RAM
    # FIXME: Placeholder
    program("cat >/dev/null" flags(no-multi-line) template(t_default));
};

destination d_tcp {
    # Remote host
    tcp("1.2.3.4" port(50505) keep-alive(yes) so_keepalive(yes) flush_lines(1) template(t_forensic));
};

destination d_console {
    # Serial console
    pipe("/dev/console" flags(no-multi-line) template(t_default));          # JCI_LOG_TEMPLATE_HOOK
};

destination d_message_log {
    # All message log file
    file("/var/log/messages" flags(no-multi-line) template(t_default));     # JCI_LOG_TEMPLATE_HOOK
};

destination d_dummy {
    # All message log file
    file("/dev/null" flags(no-multi-line) template(t_default));     # JCI_LOG_TEMPLATE_HOOK
};
        

destination d_usertty {
    # Any console (e.g. SSH) where root is logged in
    usertty("root");
};

destination d_error_log {
    # Error log file
    #file("/var/log/err_msg" flags(no-multi-line) template(t_simplified));
    program("/jci/tools/process-log  /data_persist/log/error_logs/ 2048" flags(no-multi-line) template(t_default));
};

destination d_ram_log {
    # Error log file
    program("/jci/tools/process-log  /var/log/running_log/ 512" flags(no-multi-line) template(t_default));
};

#############################################################################
# log paths

log {
    source(s_system);
    source(s_syslogng);

    parser(p_jci);
    rewrite(r_jci_log_tstamp);
    rewrite(r_nonjci);
    
    log {
        destination(d_ram_log);
    };
    
    log {
        filter(f_errors);
        filter(f_useless);
        destination(d_error_log);
    };
    
    log {
        #filter(f_user);

        #destination(d_buffer);
        #destination(d_tcp);
        destination(d_console);
        #destination(d_message_log);
        #destination(d_dummy);
        #destination(d_usertty);

        #flags(flow-control);
    };

};
